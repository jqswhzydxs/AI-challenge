server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: industrial-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 35s
services:
  core: ${CORE_URL:http://localhost:8081}
  agent: ${AGENT_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
