server:
  port: 8080

spring:
  application:
    name: ai-energy-optimization
  ai:
    openai:
      # 大模型 API Key 只允许通过环境变量注入，禁止写死在配置文件或代码中。
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: ${SPRING_AI_OPENAI_CHAT_ENABLED:true}
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.2}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:50MB}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/challenge_cup_energy?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  secret: ${JWT_SECRET:steel-energy-demo-secret-change-me}
  expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

# 日志
logging:
  level:
    com.xq.mapper: debug

# Algorithm integration
algorithm:
  runtime: ${ALGORITHM_RUNTIME:python}
  command: ${ALGORITHM_COMMAND:python}
  script: ${ALGORITHM_SCRIPT:generate_plan.py}
  matlab-command: ${ALGORITHM_MATLAB_COMMAND:matlab}
  working-dir: ${ALGORITHM_WORKING_DIR:data/algorithm}
  task-dir: ${ALGORITHM_TASK_DIR:target/algorithm-tasks}
  timeout-seconds: ${ALGORITHM_TIMEOUT_SECONDS:180}
  training-days: ${ALGORITHM_TRAINING_DAYS:7}

# Mock energy device for demos without plant-side realtime interfaces.
# Disable with MOCK_DEVICE_ENABLED=false when a real collector posts to /api/energy/realtime/push.
mock-device:
  enabled: ${MOCK_DEVICE_ENABLED:true}
  mode: ${MOCK_DEVICE_MODE:replay}
  replay-file: ${MOCK_DEVICE_REPLAY_FILE:data/algorithm/steel_data_cleaned.csv}
  interval-ms: ${MOCK_DEVICE_INTERVAL_MS:60000}
  initial-delay-ms: ${MOCK_DEVICE_INITIAL_DELAY_MS:5000}
  backfill-on-startup: ${MOCK_DEVICE_BACKFILL_ON_STARTUP:true}
  backfill-days: ${MOCK_DEVICE_BACKFILL_DAYS:7}

# Rolling MPC loop. It reads the latest collected energy point and the active day plan,
# then writes a minute-level correction command to mpc_realtime_control.
realtime-mpc:
  enabled: ${REALTIME_MPC_ENABLED:true}
  interval-ms: ${REALTIME_MPC_INTERVAL_MS:60000}
  initial-delay-ms: ${REALTIME_MPC_INITIAL_DELAY_MS:12000}

# Spring AI 工业优化 Agent 配置。
# 默认启用真实大模型调用；SPRING_AI_OPENAI_API_KEY 由环境变量注入。
# 如果模型服务不可用，业务层会自动降级到规则兜底，避免演示接口直接失败。
agent:
  llm:
    enabled: ${AGENT_LLM_ENABLED:true}
